<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E23 FAIL — saydam yüzey, opak yedek yok</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Yarı saydam + blur menü; prefers-reduced-transparency yedeği yok. */
  .menu { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); border: 1px solid #79808C; border-radius: 8px; padding: 8px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Menü</h1>
  <div class="menu">
    <p>Yarı saydam menü öğesi.</p>
  </div>
</main>
</body>
</html>
