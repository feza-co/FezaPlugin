<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E18 PASS — no drag interactions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  li { min-height: 44px; padding: 8px; margin: 4px 0; border: 1px solid #79808C; border-radius: 8px; max-width: 320px; }
  .btn { min-height: 44px; min-width: 44px; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; padding: 8px 16px; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Order</h1>
  <ul>
    <li>First item <button class="btn" type="button" aria-label="Move up">↑</button></li>
    <li>Second item <button class="btn" type="button" aria-label="Move down">↓</button></li>
  </ul>
</main>
</body>
</html>
