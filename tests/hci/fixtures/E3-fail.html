<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E3 FAIL — düşük kontrastlı giriş kenarlığı</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  label { display: block; margin-top: 12px; }
  input { font: inherit; width: 100%; max-width: 320px; height: 44px; padding: 8px; border: 1px solid #EEEEEE; border-radius: 8px; }
  .btn-primary { min-height: 44px; min-width: 44px; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; padding: 8px 16px; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kayıt</h1>
  <label for="email">E-posta</label>
  <input id="email" type="email" autocomplete="email">
  <button class="btn-primary" type="submit">Kaydet</button>
</main>
</body>
</html>
