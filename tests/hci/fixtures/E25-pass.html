<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E25 PASS — expanded accented text does not clip or scroll</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Metin kapları içeriğe göre büyür; sabit genişlik yok. */
  .label { max-width: 100%; border: 1px solid #79808C; border-radius: 8px; padding: 4px; }
  .btn { min-width: 44px; min-height: 44px; padding: 8px 16px; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <p class="label">Save all changes</p>
  <button class="btn" type="submit">Save</button>
</main>
</body>
</html>
