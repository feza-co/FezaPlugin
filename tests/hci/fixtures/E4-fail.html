<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E4 FAIL — birincil eylem 44x44 altında</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* 40x40: 24 px alt sının üstünde ama birincil eylem için 44x44 altında. */
  .btn-primary { width: 40px; height: 40px; padding: 0; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kaydı tamamla</h1>
  <p>Birincil düğme 44x44 CSS pikselden küçüktür.</p>
  <button class="btn-primary" type="submit" aria-label="Kaydet">✓</button>
</main>
</body>
</html>
