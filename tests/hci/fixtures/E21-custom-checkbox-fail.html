<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E21 FAIL — appearance:none özel onay kutusu forced-colors altında sınırsız</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Özelleştirilmiş kutu: appearance:none, sınır yok, zemin sayfayla aynı.
     forced-colors altında sistem çizimi devre dışı; görünür sınır kalmıyor. */
  .choice { width: 24px; height: 24px; min-width: 24px; min-height: 24px; margin: 0 8px 0 0; vertical-align: middle; appearance: none; -webkit-appearance: none; border: none; background: #FFFFFF; }
  .consent { display: block; margin-top: 12px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tercihler</h1>
  <p>Özel onay kutusu yalnız görünmez bir arka planla çiziliyor; yüksek karşıtlık modunda sınırı kaybolur.</p>
  <label class="consent"><input class="choice" type="checkbox"> Pazarlama e-postaları almak istiyorum</label>
</main>
</body>
</html>
