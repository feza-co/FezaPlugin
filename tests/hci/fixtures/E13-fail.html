<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E13 FAIL — %200 yazı büyütmede dikey kırpılma</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Sabit yükseklik + overflow gizli: yazı büyütülünce metin kırpılır. */
  .card { height: 34px; overflow: hidden; border: 1px solid #79808C; border-radius: 8px; padding: 4px; max-width: 320px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Sözleşme</h1>
  <div class="card">
    <p>Bu uzun açıklama, sabit yükseklikli kutuda %200 yazı büyütmede kırpılır ve okunamaz.</p>
  </div>
</main>
</body>
</html>
