<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E5 PASS — reflows at 320px</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .panel { max-width: 100%; padding: 8px; border: 1px solid #79808C; border-radius: 8px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <div class="panel">
    <p>This panel is fluid and reflows at 320 pixels without horizontal scrolling.</p>
  </div>
</main>
</body>
</html>
