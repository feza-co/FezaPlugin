<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E28 PASS — doğru başlık/bölge yapısı</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1, h2, h3 { margin: 8px 0; }
  .btn { min-width: 44px; min-height: 44px; padding: 8px 16px; margin: 4px; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Products</h1>
  <h2>Categories</h2>
  <h3>Sub category</h3>
  <p>One h1, no skipped heading levels, a main landmark and every interactive element is named.</p>
  <button class="btn" type="button">Add product</button>
</main>
</body>
</html>
