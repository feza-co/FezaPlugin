<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E14 PASS — focused element not obscured</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .save-btn { width: 44px; height: 44px; min-width: 44px; min-height: 44px;
    background: #1D5FD1; color: #FFFFFF; border: none; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Sign up</h1>
  <p>Use the button below to finish the form.</p>
  <button class="save-btn" type="button">Save</button>
</main>
</body>
</html>
