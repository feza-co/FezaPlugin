<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E14 FAIL — odak sabit katman altında tamamen örtülüyor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Sabit alt çubuk; odaklanan düğmeyi tamamen örter. */
  .fixedbar { position: fixed; left: 0; right: 0; bottom: 0; height: 300px; background: #F4F6F8; border-top: 1px solid #79808C; }
  .obscured-btn { position: absolute; bottom: 60px; left: 16px; width: 44px; height: 44px; min-width: 44px; min-height: 44px;
    background: #1D5FD1; color: #FFFFFF; border: none; border-radius: 8px; font: inherit; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kayıt</h1>
  <p>Formu tamamlamak için aşağıdaki düğmeyi kullanın.</p>
</main>
<button class="obscured-btn" type="button">Kaydet</button>
<div class="fixedbar" aria-hidden="true"></div>
</body>
</html>
