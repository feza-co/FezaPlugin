<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E6 FAIL — odak göstergesi yok</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .btn { min-width: 44px; min-height: 44px; padding: 8px 16px; margin: 4px; background: #1D5FD1; color: #FFFFFF; border: none; border-radius: 8px; font: inherit; }
  /* Klavye odağını tamamen gizle. */
  :focus, :focus-visible { outline: none !important; box-shadow: none !important; }
</style>
</head>
<body>
<main>
  <h1>Bildirimler</h1>
  <p>Klavye ile sekmelendiğinde odak göstergesi görünmez.</p>
  <button class="btn" type="button">Tümünü okundu işaretle</button>
</main>
</body>
</html>
