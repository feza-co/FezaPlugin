<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E16 PASS — text spacing does not clip</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .box { max-width: 320px; border: 1px solid #79808C; border-radius: 8px; padding: 4px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>About</h1>
  <div class="box">
    <p>This longer description flows in a container without a fixed height or hidden overflow, so increasing line, letter and word spacing never clips the text.</p>
  </div>
</main>
</body>
</html>
