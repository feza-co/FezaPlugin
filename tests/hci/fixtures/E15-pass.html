<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E15 PASS — small targets with sufficient spacing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .tiny { width: 20px; height: 20px; padding: 0; background: #1D5FD1; color: #FFFFFF; border: 1px solid transparent; border-radius: 4px; font: inherit; }
  .row { display: flex; gap: 40px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Row editing</h1>
  <p>These small buttons are far enough apart to satisfy the spacing exception.</p>
  <div class="row">
    <button class="tiny" type="button" aria-label="Move up">↑</button>
    <button class="tiny" type="button" aria-label="Move down">↓</button>
  </div>
</main>
</body>
</html>
