<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E24 FAIL — RTL'e geçince yatay taşma</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  /* Fiziksel yön: right:0 ile geniş panel; RTL'de aynı özellik sola çevrilip taşır. */
  .panel { position: absolute; right: 0; top: 80px; width: 600px; height: 40px; background: #F4F6F8; border: 1px solid #79808C; border-radius: 8px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Panel</h1>
  <p>Fiziksel yön özellikleri RTL'e geçişte yatay taşmaya yol açar.</p>
</main>
<div class="panel"></div>
</body>
</html>
