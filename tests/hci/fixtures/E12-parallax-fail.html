<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E12 FAIL — kaydırmaya bağlı parallax (reduce altında da sürüyor)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: #1B2430; background: #FFFFFF; }
  main { max-width: 100%; padding: 16px; }
  h1 { font-size: 24px; }
  .tall { height: 1600px; }
  /* Kaydırma ile transform değişen parallax; reduce tercihi yok sayılıyor. */
  .parallax { position: fixed; top: 40%; left: 0; width: 120px; height: 120px; background: #1D5FD1; border-radius: 8px; }
  :focus-visible { outline: 3px solid #1D5FD1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kampanya</h1>
  <p>Bu katman, sayfa kaydırıldıkça transform ile hareket eder ve hareket azaltma tercihinde de kapanmaz.</p>
  <div class="tall"></div>
</main>
<div class="parallax"></div>
<script>
  addEventListener('scroll', function () {
    document.querySelector('.parallax').style.transform = 'translateY(' + (window.scrollY * 0.4) + 'px)';
  });
</script>
</body>
</html>
