name: Bug report
description: A skill behaves incorrectly, produces a wrong document or fails to install.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do not include confidential
        project content; a minimal brief that reproduces the issue is enough.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - feza-requirements
        - feza-pm
        - feza-hci
        - feza-sqa
        - feza-toolkit
        - Repository / scripts / manifests
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill
      description: For example `srs-generate` or `/feza-pm:wbs`.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - Other Agent Skills client
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FezaPlugin version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or request you used and the relevant project files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or the relevant part of the generated document.
    validations:
      required: true
