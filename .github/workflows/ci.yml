name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Sync and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generated files are up to date
        run: python scripts/sync.py --check

      - name: Syntax-check skill scripts (JavaScript)
        run: |
          set -euo pipefail
          git ls-files -z 'plugins/**/scripts/*.mjs' | xargs -0 -r -n1 node --check
          echo "All skill .mjs scripts parse."

      - name: Syntax-check skill scripts (Python)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git ls-files -z 'plugins/**/scripts/*.py' | xargs -0 -r -n1 python -m py_compile
          echo "All skill .py scripts compile."

      - name: Static validation
        run: python scripts/validate.py

      - name: JSON lint
        run: |
          set -euo pipefail
          git ls-files -z '*.json' | xargs -0 -n1 python -m json.tool > /dev/null
          echo "All JSON files are valid."

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.yaml
          globs: |
            *.md
            docs/**/*.md
            plugins/*/README.md
            .github/**/*.md

  hci-fixtures:
    name: HCI fixture suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # verify-ui.mjs bağımlılıkları önbellek dizininden çözer: Linux'ta
      # $HOME/.cache/feza-ui-check (Windows'ta %LOCALAPPDATA%\feza-ui-check).
      # Aynı dizine kurup FEZA_UI_CHECK_NO_INSTALL=1 ile ağ erişimini kapatıyoruz.
      - name: Install verify-ui dependencies into its cache dir
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/feza-ui-check"
          mkdir -p "$CACHE"
          # verify-ui önbelleği yalnız package.json varsa çözer (createRequire).
          printf '{"name":"feza-ui-check-deps","private":true}' > "$CACHE/package.json"
          npm install --prefix "$CACHE" --no-save playwright @axe-core/playwright
          npx --prefix "$CACHE" playwright install --with-deps chromium

      - name: Run HCI fixture suite
        env:
          FEZA_UI_CHECK_NO_INSTALL: "1"
        run: node tests/hci/run.mjs
